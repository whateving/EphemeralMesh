services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The named volume preserves relay state across image replacements.
      MESH_DB: /data/relay.db
    volumes:
      - relay-data:/data
    ports:
      # Admin endpoints are reachable only locally or through an SSH tunnel.
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2.11.4-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      MESH_DOMAIN: ${MESH_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  relay-data:
  caddy-data:
  caddy-config:
