<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral Mesh UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --bg-outer: #fbcfe8;
            --card-bg: #fff0f6;
            --pink-accent: #f43f5e;
            --pink-light-bg: #ffe4e6;
            --grid-line: #fecdd3;
            --text-color: #be123c;
            --border-color: #fda4af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'VT323', monospace; }

        body {
            background-color: var(--bg-outer);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 740px;
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .app-header {
            padding: 12px 16px;
            background-color: #fff;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .target-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .target-title {
            font-size: 1.3rem;
            color: var(--text-color);
            font-weight: bold;
        }

        .btn-target {
            background-color: var(--pink-light-bg);
            color: var(--pink-accent);
            border: 2px solid var(--pink-accent);
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-target:hover {
            background-color: var(--pink-accent);
            color: #fff;
        }

        .radar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fca5a5; transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--pink-accent); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Target Tabs Bar */
        .target-bar {
            padding: 8px 12px;
            background-color: var(--pink-light-bg);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .target-bar::-webkit-scrollbar { height: 4px; }
        .target-bar::-webkit-scrollbar-thumb { background: var(--pink-accent); border-radius: 4px; }

        .target-tab {
            background-color: #fff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .target-tab.active {
            background-color: var(--pink-accent);
            color: #fff;
            border-color: var(--pink-accent);
        }
        .target-tab.bot-tab {
            border-color: var(--pink-accent);
            font-weight: bold;
        }

        /* Radar Display */
        .radar-panel {
            background-color: #fff5f8;
            border-bottom: 2px solid var(--border-color);
            padding: 12px;
            transition: all 0.3s ease-in-out;
            max-height: 200px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .radar-panel.collapsed {
            max-height: 0;
            padding: 0 12px;
            border-bottom: none;
            opacity: 0;
        }

        .radar-grid {
            width: 100%;
            height: 110px;
            border: 1px solid var(--border-color);
            background-image:
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 15px 15px;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .radar-circle-outer {
            width: 80px; height: 80px;
            border: 1.5px solid var(--border-color);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }

        .radar-circle-inner {
            width: 40px; height: 40px;
            border: 1.5px solid var(--border-color);
            border-radius: 50%;
        }

        .radar-blip {
            width: 8px; height: 8px;
            background-color: var(--pink-accent);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 6px var(--pink-accent);
            animation: pulse 1.5s infinite alternate;
            left: 50%;
            top: 50%;
            margin-left: -4px;
            margin-top: -4px;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.7; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        .radar-distance {
            width: 100%; text-align: right; margin-top: 4px;
            font-size: 1.1rem; color: var(--text-color);
        }

        /* Chat Messages */
        .chat-messages {
            /* Only history absorbs the remaining height; its content must not
               compete with the contacts/radar for space in the outer column. */
            flex: 1 1 0;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bubble {
            /* Tall images and voice notes scroll instead of compressing bubbles. */
            flex-shrink: 0;
            max-width: 85%;
            padding: 10px 14px;
            font-size: 1.2rem;
            line-height: 1.25;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        .msg-bubble.sent {
            align-self: flex-end;
            background-color: var(--pink-accent);
            color: #fff;
            border-radius: 16px 16px 2px 16px;
        }

        .msg-bubble.received {
            align-self: flex-start;
            background-color: #fff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 16px 16px 16px 2px;
        }

        /* Message Metadata & Ticks */
        .msg-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 2px;
            font-size: 0.95rem;
            line-height: 1;
        }

        .status-tick {
            font-weight: bold;
            letter-spacing: -1px;
        }

        .status-tick.sent {
            opacity: 0.6;
            color: #fff;
        }

        .status-tick.delivered {
            opacity: 0.9;
            color: #fff;
        }

        .status-tick.read {
            color: #4ade80; /* Bright Green */
            text-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
        }

        /* Custom AI Bot Bubble */
        .msg-bubble.bot-response {
            align-self: flex-start;
            background-color: #fff;
            color: var(--text-color);
            border: 2px solid var(--pink-accent);
            border-radius: 16px 16px 16px 2px;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.15);
            position: relative;
        }

        .bot-badge {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            background-color: var(--pink-accent);
            padding: 1px 6px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .bot-tag-highlight {
            background-color: #ffe4e6;
            color: #f43f5e;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .system-msg {
            align-self: center;
            font-size: 1rem;
            color: #f43f5e;
            background-color: var(--pink-light-bg);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            text-align: center;
        }

        /* Input Area */
        .input-area {
            padding: 12px 16px;
            background-color: #fff;
            border-top: 2px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px 12px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1.2rem;
            outline: none;
        }

        button.send-btn {
            width: 40px; height: 40px;
            background-color: var(--pink-accent);
            color: white; border: none; border-radius: 50%;
            cursor: pointer; display: flex;
            justify-content: center; align-items: center;
            font-size: 1.2rem;
        }

        button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
        [hidden] { display: none !important; }
        .attachment-preview { max-width: 100%; max-height: 240px; display: block; margin-top: 6px; }
        audio { max-width: 100%; }
        /* Keep the composer usable on small screens and long messages within their bubble. */
        .app-container { height: min(900px, calc(100dvh - 24px)); min-height: 640px; }
        body { padding: 12px; }
        input[type="text"] { min-width: 0; }
        .msg-bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
        .connection-bar, .identity-bar, .contact-tools, .notice { padding: 5px 12px; font-size: 1rem; overflow-wrap: anywhere; }
        .identity-bar { font-size: .85rem; }
        .contact-tools { display: flex; gap: 6px; flex-wrap: wrap; }
        .notice { color: #9f1239; }
        /* Keep controls at their natural height even after a large history loads.
           On small screens the card/page can scroll rather than clipping controls. */
        .app-container { overflow-y: auto; }
        .app-container > :not(.chat-messages) { flex-shrink: 0; }
        .target-tab { flex-shrink: 0; }
        .radar-grid { flex-shrink: 0; }
        .chat-messages { min-height: 160px; overscroll-behavior: contain; }
        /* Let the header wrap on narrow phones without pushing RADAR off-screen. */
        .app-header { flex-wrap: wrap; gap: 8px; }
        .target-title { max-width: 145px; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 360px) { body { padding: 0; } .app-container { height: 100dvh; border-radius: 0; } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="target-selector">
                <span class="target-title" id="current-target">NO TARGET</span>
                <button class="btn-target" onclick="promptNewContact()">+ TARGET</button>
            </div>

            <div class="radar-controls">
                <span>RADAR</span>
                <label class="switch">
                    <input type="checkbox" id="radar-toggle" onchange="toggleRadar()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Both connection layers and the persistent identity are visible while testing. -->
        <div class="connection-bar" id="connection-status" role="status">Connecting to local client…</div>
        <div class="identity-bar" id="my-identity"></div>
        <div class="notice" id="notice" role="alert"></div>
        <div class="contact-tools">
            <button class="btn-target" onclick="renameContact()">NAME</button>
            <button class="btn-target" onclick="verifyContact()">VERIFY KEYS</button>
            <span id="presence-status"></span>
            <span id="typing-status"></span>
        </div>
        <!-- Target Tabs Bar -->
        <div class="target-bar" id="target-bar"></div>

        <!-- Collapsible Radar -->
        <div class="radar-panel collapsed" id="radar-panel">
            <div class="radar-grid">
                <div class="radar-circle-outer"><div class="radar-circle-inner"></div></div>
                <div class="radar-blip"></div>
            </div>
            <div class="radar-distance" id="radar-distance">DIST: -- mi</div>
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="messages-container"></div>

        <!-- Media shares the same encrypted, durable delivery path as text. -->
        <div class="contact-tools">
            <button class="btn-target" onclick="chooseImage()">PICTURE / GIF</button>
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" onchange="selectedImage(event)" hidden>
            <button class="btn-target" id="record-btn" onclick="recordVoice()">VOICE</button>
        </div>
        <div id="voice-draft" class="contact-tools" hidden>
            <span id="voice-recipient"></span>
            <audio id="voice-preview" controls></audio>
            <button class="btn-target" onclick="sendVoice()">SEND VOICE</button>
            <button class="btn-target" onclick="cancelVoice()">CANCEL</button>
        </div>
        <!-- Input Form -->
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Message... (use @bot for AI)" onkeydown="handleEnter(event)" oninput="sendTyping()" maxlength="8000" disabled>
            <button class="send-btn" id="send-btn" onclick="sendPayload()" disabled>&#10148;</button>
        </div>
    </div>

    <!-- Protocol and rendering live in one local script; no messages are interpreted as HTML. -->
    <script src="/app.js"></script>
</body>
</html>
